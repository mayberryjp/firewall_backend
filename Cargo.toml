[workspace]
resolver = "2"
exclude = ["third_party/mozim"]
members = [
    "crates/netcontrol-core",
    "crates/netcontrol-native",
    "crates/netcontrol-services",
    "crates/netcontrold",
    "crates/netcontrol-package",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
libc = "0.2"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[patch.crates-io]
mozim = { path = "third_party/mozim" }
