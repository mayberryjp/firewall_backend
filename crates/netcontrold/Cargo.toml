[package]
name = "netcontrold"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
tokio.workspace = true
libc.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["json"] }
netcontrol-core = { path = "../netcontrol-core" }
netcontrol-native = { path = "../netcontrol-native" }
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
clap = { version = "4", features = ["derive"] }
argon2 = "0.5"
subtle = "2"
fs2 = "0.4"
time = { version = "0.3", features = ["formatting", "parsing"] }
mime = "0.3"
russh = { version = "=0.63.1", default-features = false, features = ["ring"] }
zeroize = "1"
# Russh's debug/trace logs can contain plaintext protocol packets.
log = { version = "0.4", features = ["max_level_info"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tempfile = "3"
