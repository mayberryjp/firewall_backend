name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      upload_packages:
        description: "Upload development packages only after reviewing distribution licensing, including rustables GPL-3.0-or-later"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Rust checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - name: Install native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libclang-dev linux-libc-dev
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable test --workspace --locked
      - run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +stable build --workspace --release --locked
      - name: Check OpenRC configuration syntax
        if: runner.os == 'Linux'
        run: |
          sh -n packaging/native/netcontrold.initd
          sh -n packaging/native/netcontrold.confd

  native:
    name: Privileged native Rust integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libclang-dev linux-libc-dev
      - name: Prepare kernel modules
        run: |
          for module in dummy 8021q wireguard nf_tables nf_conntrack nf_nat; do
            sudo modprobe "$module"
          done
      - run: cargo +stable test -p netcontrol-native -p netcontrol-services --locked --no-run
      - name: Test native kernel and protocol workers
        run: |
          sudo env "PATH=$PATH" NETCONTROL_INTEGRATION=1 \
            "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" \
            "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
            cargo +stable test -p netcontrol-native -p netcontrol-services --locked -- --ignored

  package:
    name: Signed native package (${{ matrix.arch }})
    needs: [checks, native]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y musl-tools libclang-dev linux-libc-dev
      - name: Build static native binaries
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          RUSTFLAGS: "-C linker=rust-lld -C link-self-contained=yes"
        run: |
          export "CC_${TARGET//-/_}=musl-gcc"
          export BINDGEN_EXTRA_CLANG_ARGS="-I/usr/include/$ARCH-linux-musl -I/usr/include -I/usr/include/$ARCH-linux-gnu"
          cargo +stable build --release --locked --target "$TARGET" -p netcontrold -p netcontrol-package
      - name: Create, verify and installation-test custom package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          mkdir -p dist
          temporary="$(mktemp -d)"
          trap 'rm -f "$temporary/signing.key"; rmdir "$temporary"' EXIT
          package_tool="target/$TARGET/release/netcontrol-package"
          "$package_tool" keygen --private-key "$temporary/signing.key" --public-key dist/signing.pub
          "$package_tool" build \
            --daemon "target/$TARGET/release/netcontrold" \
            --installer "$package_tool" \
            --target "$TARGET" --signing-key "$temporary/signing.key" \
            --output "dist/netcontrol-$TARGET-${GITHUB_SHA}.ncpkg"
          "$package_tool" verify "dist/netcontrol-$TARGET-${GITHUB_SHA}.ncpkg" \
            --public-key dist/signing.pub
          staging="$(mktemp -d)"
          "$package_tool" install "dist/netcontrol-$TARGET-${GITHUB_SHA}.ncpkg" \
            --public-key dist/signing.pub --root "$staging"
          "$staging/usr/sbin/netcontrold" --help
          cp "$package_tool" dist/
          printf '{"commit":"%s","target":"%s","release":null}\n' "$GITHUB_SHA" "$TARGET" > dist/BUILDINFO.json
          (cd dist && sha256sum *.ncpkg signing.pub netcontrol-package BUILDINFO.json > SHA256SUMS)
      - name: Upload custom package, installer, public key and provenance
        if: github.event_name == 'workflow_dispatch' && inputs.upload_packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: netcontrol-native-${{ matrix.arch }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
