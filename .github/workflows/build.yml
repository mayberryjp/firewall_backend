name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      upload_packages:
        description: "Upload development packages after distribution licensing review, including rustables GPL-3.0-or-later"
        type: boolean
        default: false
      from_commit:
        description: "Optional full SHA before a default-branch replay range (exclusive)"
        type: string
      to_commit:
        description: "Optional full SHA ending a default-branch replay range (inclusive)"
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  plan:
    name: Select commits
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        run: python3 .github/scripts/releases.py plan

  commits:
    name: Validate commit
    needs: plan
    if: needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: write
      actions: read
    with:
      commit: ${{ matrix.commit }}
      publish: ${{ needs.plan.outputs.publish == 'true' }}
      upload_packages: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_packages }}

  latest:
    name: Promote newest successful release
    needs: [plan, commits]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.publish == 'true' && needs.plan.outputs.count != '0' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: netcontrol-stable-latest
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 .github/scripts/releases.py latest
